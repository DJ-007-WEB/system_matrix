services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-supplychain}
      POSTGRES_USER: \${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-sentinel}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d supplychain"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: \${DATABASE_URL:-postgresql+psycopg://sentinel:sentinel@db:5432/supplychain}
      OPENAI_API_KEY: \${OPENAI_API_KEY:-}
      OPENAI_MODEL: \${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: \${GEMINI_API_KEY:-}
      GEMINI_MODEL: \${GEMINI_MODEL:-gemini-2.5-flash}
      UPLOAD_DIR: /app/uploads
    ports: ["8000:8000"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  uploads:
